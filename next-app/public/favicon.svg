<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#080808" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A2FF" />
      <stop offset="100%" stop-color="#0066EE" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect x="20" y="20" width="472" height="472" rx="108" fill="url(#bgGrad)" stroke="#222222" stroke-width="6" />
  
  <!-- Subtle Neon Accent Inner Frame -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="url(#blueGrad)" stroke-width="4" stroke-opacity="0.5" />

  <!-- Monogram AT: Premium Editorial Serif Typography -->
  <text x="238" y="325" 
        font-family="'Playfair Display', 'Lora', 'Georgia', 'Times New Roman', serif" 
        font-size="220" 
        font-weight="900" 
        letter-spacing="-6" 
        fill="#FFFFFF" 
        text-anchor="middle">AT</text>

  <!-- Editorial Blue Accent Dot -->
  <circle cx="392" cy="315" r="22" fill="#008CFF" />
</svg>